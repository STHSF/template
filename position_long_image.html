<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>仓位长图</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #f4f7fb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      justify-content: center;
      padding: 16px 12px 32px;
    }

    .page {
      width: 100%;
      max-width: 414px;
    }

    .image-wrap {
      border-radius: 18px;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 12px 30px rgba(119, 137, 178, 0.12);
    }

    .image-wrap img {
      display: block;
      width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="image-wrap">
      <img src="./position_long_original.jpg" alt="仓位长图" />
    </div>
  </main>
</body>
</html>
